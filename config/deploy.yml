# Kamal 2 deploy config — https://kamal-deploy.org
service: shopzilla
image: chrisbaptiste83/shopzilla

servers:
  web:
    hosts:
      - 172.235.34.185
    labels:
      traefik.http.routers.shopzilla-web.rule: Host(`gloriasembroideryshop.com`)
      traefik.http.routers.shopzilla-web-secure.rule: Host(`gloriasembroideryshop.com`)
      traefik.http.routers.shopzilla-web-secure.entrypoints: websecure
      traefik.http.routers.shopzilla-web-secure.tls.certresolver: letsencrypt

proxy:
  ssl: true
  host: gloriasembroideryshop.com

registry:
  username: chrisbaptiste83
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    FRONTEND_URL: https://chrisbaptiste83.github.io
  secret:
    - RAILS_MASTER_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET

volumes:
  - shopzilla_storage:/rails/storage

asset_path: /rails/public/assets
