image: ruby:3.4.2

variables:
  GIT_STRATEGY: clone
  FF_NETWORK_PER_BUILD: "true"
  AWS_REGION: us-east-2
  ECR_REGISTRY: "673588459621.dkr.ecr.us-east-2.amazonaws.com"
  ECR_REPOSITORY: shopzilla
  ECS_CLUSTER: default
  ECS_SERVICE: shopzilla-web
  CONTAINER_NAME: shopzilla
  POSTGRES_USER: rails
  POSTGRES_PASSWORD: password
  POSTGRES_DB: shopzilla_test
  RAILS_ENV: test
  PGHOST: postgres
  PGUSER: rails
  PGPASSWORD: password

stages:
  - test
  - build
  - deploy

# ── Test ──────────────────────────────────────────────────────────────────────

.ruby_setup: &ruby_setup
  before_script:
    - apt-get update -qq && apt-get install -y libpq-dev libvips nodejs npm
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3

brakeman:
  stage: test
  <<: *ruby_setup
  script:
    - bundle exec brakeman --no-pager
  only:
    - merge_requests
    - main

rubocop:
  stage: test
  <<: *ruby_setup
  script:
    - bundle exec rubocop --format progress
  only:
    - merge_requests
    - main

rspec:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    DATABASE_URL: postgres://rails:password@postgres/shopzilla_test
  <<: *ruby_setup
  script:
    - bash test/docker_entrypoint_test.sh
    - npm install -g yarn && yarn install
    - bundle exec rails db:test:prepare
    - bundle exec rails test
  artifacts:
    when: on_failure
    paths:
      - tmp/screenshots/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: ubuntu:22.04
  services:
    - name: docker:26.1.4-dind
      alias: docker
  variables:
    DEBIAN_FRONTEND: noninteractive
    # The shared runners deliberately do not mount the host Docker socket.
    # Keep this job on the same isolated DIND path as the other applications.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl unzip ca-certificates
    - |
      ARCH=$(uname -m)
      curl -fsSL "https://download.docker.com/linux/static/stable/${ARCH}/docker-26.1.4.tgz" \
        | tar xz --strip-components=1 -C /usr/local/bin docker/docker
    - |
      case "$(uname -m)" in aarch64) BUILDX_ARCH=arm64 ;; *) BUILDX_ARCH=amd64 ;; esac
      mkdir -p ~/.docker/cli-plugins
      curl -fsSL "https://github.com/docker/buildx/releases/download/v0.16.2/buildx-v0.16.2.linux-${BUILDX_ARCH}" \
        -o ~/.docker/cli-plugins/docker-buildx
      chmod +x ~/.docker/cli-plugins/docker-buildx
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      docker info >/dev/null
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ARCH=$(uname -m)
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      fi
  script:
    # The legacy builder resolves FROM against the host's (arm64) image cache
    # even with --platform; a docker-container BuildKit builder does not.
    - docker rm -f buildx_buildkit_ci-builder0 2>/dev/null || true
    - docker buildx create --name ci-builder --driver docker-container --use
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker buildx build \
          --platform linux/amd64 \
          --push \
          --provenance=false \
          --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:latest \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
      else
        # MR builds exercise the production Dockerfile without publishing an
        # image or requiring protected AWS credentials.
        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --output type=cacheonly \
          .
      fi
    - docker buildx rm ci-builder || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: python:3.12-alpine
  before_script:
    - pip install awscli --quiet
  script:
    - |
      # Pull current task definition, update image, register new revision
      TASK_DEF=$(aws ecs describe-task-definition \
        --task-definition $ECS_SERVICE \
        --region $AWS_REGION \
        --query 'taskDefinition' \
        --output json)

      NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
      import sys, json
      d = json.load(sys.stdin)
      for c in d['containerDefinitions']:
          if c['name'] == '$CONTAINER_NAME':
              c['image'] = '$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA'
      # Strip read-only fields
      for k in ['taskDefinitionArn','revision','status','requiresAttributes',
                'compatibilities','registeredAt','registeredBy','deregisteredAt']:
          d.pop(k, None)
      print(json.dumps(d))
      ")

      NEW_TASK_ARN=$(aws ecs register-task-definition \
        --region $AWS_REGION \
        --cli-input-json "$NEW_TASK_DEF" \
        --query 'taskDefinition.taskDefinitionArn' \
        --output text)

      echo "Registered new task definition: $NEW_TASK_ARN"

      aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service $ECS_SERVICE \
        --task-definition $NEW_TASK_ARN \
        --region $AWS_REGION \
        --query 'service.deployments[0].status' \
        --output text

      echo "Waiting for service to stabilize..."
      aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE \
        --region $AWS_REGION

      echo "Deploy complete."
  environment:
    name: production
    url: https://gloriasembroideryshop.com
  only:
    - main
  when: manual
  needs:
    - build

